[package]
license = "MIT OR Apache-2.0"
description = "Platform hooks, overlays, and pointer output adapters for Clickless"
repository = "https://github.com/smresponsibilities/clickless"
readme = "../../README.md"
name = "clickless-platform"
version = "0.1.3"
edition = "2024"
build = "build.rs"

[features]
default = []
gpui-settings = []
winui3 = [
    "dep:winio-winui3",
    "dep:windows-core",
    "dep:windows",
    "dep:naui-winui3",
    "dep:windows-collections",
]

[dependencies]
clickless-core = { version = "0.1.3", path = "../clickless-core" }
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies.winio-winui3]
version = "0.4.5"
optional = true
features = [
    "UI_Xaml",
    "UI_Xaml_Controls",
    "UI_Xaml_Controls_Primitives",
    "UI_Xaml_Markup",
    "UI_Xaml_Media",
    "UI_Xaml_XamlTypeInfo",
    "UI_Composition",
    "UI_Dispatching",
    "native",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"
optional = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
optional = true
features = ["Foundation"]

[target.'cfg(windows)'.dependencies.naui-winui3]
version = "0.8.0"
optional = true

[target.'cfg(windows)'.dependencies.windows-collections]
version = "0.3"
optional = true

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
libc = "0.2.189"
evdev = "0.12"
x11rb = { version = "0.13", default-features = false, features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
libc = "0.2.189"
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSDate", "NSRunLoop", "NSNotification", "NSString", "NSOperation", "block2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSScreen",
    "NSApplication",
    "NSButton",
    "NSTextField",
    "NSStackView",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSWorkspace",
    "objc2-core-graphics",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3.27.0"
