[package]
license = "MIT OR Apache-2.0"
description = "Keyboard-driven pointer control with native Windows UI and experimental Linux/macOS backends"
repository = "https://github.com/smresponsibilities/clickless"
readme = "../../README.md"
name = "clickless"
version.workspace = true
edition.workspace = true

[lib]
name = "clickless_cli"
path = "src/lib.rs"

[[bin]]
name = "clickless"
path = "src/main.rs"

[[bin]]
name = "clicklessctl"
path = "src/bin/clicklessctl.rs"

[[bin]]
name = "clickless-settings"
path = "src/bin/clickless-settings.rs"

[features]
# Windows-only visual settings shell (WinUI 3). The native Win32 shell remains
# available in builds without this feature.
default = ["winui3", "gpui-settings"]
winui3 = ["clickless-platform/winui3"]
gpui-settings = ["clickless-platform/gpui-settings", "dep:gpui-kit"]

[dependencies]
gpui-kit = { version = "=0.6.6", default-features = false, features = ["component", "assets"], optional = true }
clickless-core = { version = "0.1.3", path = "../clickless-core" }
clickless-platform = { version = "0.1.3", path = "../clickless-platform" }
ctrlc = { version = "3.5.2", features = ["termination"] }
