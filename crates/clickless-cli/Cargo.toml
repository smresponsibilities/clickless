[package]
description = "Keyboard-driven pointer control with native Windows UI and experimental Linux/macOS backends"
repository = "https://github.com/smresponsibilities/clickless"
readme = "../../README.md"
name = "clickless-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "clickless_cli"
path = "src/lib.rs"

[[bin]]
name = "clickless"
path = "src/main.rs"

[[bin]]
name = "clicklessctl"
path = "src/bin/clicklessctl.rs"

[[bin]]
name = "clickless-settings"
path = "src/bin/clickless-settings.rs"

[features]
# Windows-only visual settings shell (WinUI 3). The native Win32 shell remains
# available in builds without this feature.
default = ["winui3"]
winui3 = ["clickless-windows/winui3"]

[dependencies]
clickless-core = { version = "0.1.0", path = "../clickless-core" }
clickless-config = { version = "0.1.0", path = "../clickless-config" }
clickless-backend-api = { version = "0.1.0", path = "../clickless-backend-api" }
clickless-output-enigo = { version = "0.1.0", path = "../clickless-output-enigo" }

[target.'cfg(windows)'.dependencies]
clickless-windows = { version = "0.1.0", path = "../clickless-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
clickless-linux = { version = "0.1.0", path = "../clickless-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
clickless-macos = { version = "0.1.0", path = "../clickless-macos" }
