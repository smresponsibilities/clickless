[package]
name = "clickless-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "clickless_cli"
path = "src/lib.rs"

[[bin]]
name = "clickless"
path = "src/main.rs"

[[bin]]
name = "clicklessctl"
path = "src/bin/clicklessctl.rs"

[features]
# Windows-only visual settings shell (WinUI 3). The native Win32 shell remains
# the runtime fallback when Windows App SDK creation fails.
default = ["winui3"]
winui3 = ["clickless-windows/winui3"]

[dependencies]
clickless-core = { path = "../clickless-core" }
clickless-config = { path = "../clickless-config" }
clickless-backend-api = { path = "../clickless-backend-api" }
clickless-output-enigo = { path = "../clickless-output-enigo" }

[target.'cfg(windows)'.dependencies]
clickless-windows = { path = "../clickless-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
clickless-linux = { path = "../clickless-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
clickless-macos = { path = "../clickless-macos" }
