[package]
name = "clickless-macos"
version = "0.1.0"
edition = "2024"

[dependencies]
clickless-core = { path = "../clickless-core" }
clickless-backend-api = { path = "../clickless-backend-api" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-graphics",
] }

[dev-dependencies]
clickless-backend-api = { path = "../clickless-backend-api" }
