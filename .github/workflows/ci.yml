name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: 2

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev libxcb-randr0-dev libxcb-keysyms1-dev libegl1-mesa-dev libvulkan-dev
      - name: Install Windows App SDK runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeInstaller = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/2.0/latest/windowsappruntimeinstall-x64.exe' -OutFile $runtimeInstaller
          $signature = Get-AuthenticodeSignature -LiteralPath $runtimeInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'Windows App SDK installer signature is invalid'
          }
          $runtimeInstall = Start-Process -FilePath $runtimeInstaller -ArgumentList '--quiet' -Wait -PassThru -WindowStyle Hidden
          if ($runtimeInstall.ExitCode -ne 0) { throw "Windows App SDK install failed: $($runtimeInstall.ExitCode)" }
      - name: Format check
        run: cargo fmt --all --check
      - name: Build
        run: cargo build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features

